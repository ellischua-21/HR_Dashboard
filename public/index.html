<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Management System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link id="app-styles" rel="stylesheet" href="css/Styles.css" />
    <link id="app-theme" rel="stylesheet" href="css/Theme.css" />
  </head>
  <body>
    <main id="bootstrap-screen" class="login" aria-live="polite">
      <div class="login-card">
        <h1>HR Management System</h1>
        <p id="bootstrap-status" class="note" role="status"></p>
      </div>
    </main>
    <div id="app" hidden>
      <aside id="side" aria-label="Main navigation">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 88 68" role="img" aria-label="Placeholder people logo" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="86" height="66" rx="20" fill="#f5efeb" />
            <circle cx="23" cy="28" r="6" fill="#6b8e23" />
            <circle cx="65" cy="28" r="6" fill="#6b8e23" />
            <path d="M12 48c0-8 4-13 11-13s11 5 11 13" fill="#6b8e23" />
            <path d="M54 48c0-8 4-13 11-13s11 5 11 13" fill="#6b8e23" />
            <circle cx="44" cy="22" r="9" fill="#c86b4b" />
            <path d="M27 54c0-12 6-20 17-20s17 8 17 20" fill="#c86b4b" stroke="#f5efeb" stroke-width="3" />
          </svg>
        </div>
        <nav id="nav"></nav>
        <div class="who">
          <span id="uemail"></span><br /><small id="urole"></small><br /><button
            class="ghost"
            id="logoutBtn"
            type="button"
          >
            Sign out
          </button>
        </div>
      </aside>
      <div id="main">
        <header>
          <button id="menuBtn" aria-label="Toggle menu">Menu</button>
          <h1 id="title">Dashboard</h1>
          <span id="busy"></span>
        </header>
        <section id="view-dashboard" class="view">
          <div id="dashboard-fragment"></div>
        </section>
        <div id="reports-fragment"></div>
        <div id="hr-performance-fragment"></div>
        <div id="employees-fragment"></div>
        <div id="attendance-fragment"></div>
        <div id="employee-dashboard-fragment"></div>
        <div id="accounts-fragment"></div>
        <div id="account-settings-fragment"></div>
        <div id="user-dashboard-fragment"></div>
        <div id="incident-management-fragment"></div>
        <section id="view-soon" class="view" hidden>
          <p class="soon" id="soonMsg"></p>
        </section>
      </div>
    </div>
    <button
      id="back-to-top"
      class="back-to-top"
      type="button"
      aria-label="Back to top"
      title="Back to top"
      hidden
    >
      ↑
    </button>
    <section id="leave-print-root" aria-hidden="true"></section>
    <script src="js/Feedback.js?v=20261102-50"></script>
    <script src="js/Loading.js?v=20261106-83"></script>
    <script src="js/ui-loader.js?v=20261106-96"></script>
  </body>
</html>
