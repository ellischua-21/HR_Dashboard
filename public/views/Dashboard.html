<form class="filters" id="filters" onsubmit="return false">
  <label>From<input type="date" id="f_dateFrom"></label>
  <label>To (reporting date)<input type="date" id="f_dateTo"></label>
  <label>Company<select id="f_company"></select></label>
  <label>Department<select id="f_department"></select></label>
  <label>Work location<select id="f_location"></select></label>
  <label>Employment status<select id="f_status"></select></label>
  <label>Employee rank<select id="f_rank"></select></label>
  <label>Function type<select id="f_function_type"></select></label>
  <button type="button" id="applyBtn">Apply filters</button>
  <button type="button" class="ghost" id="resetBtn">Reset</button>
</form>
