<section id="view-attendance" class="view" hidden>
  <section class="panel">
    <form id="attendance-filters" class="toolbar attendance-filters">
      <div class="attendance-day-controls">
        <button id="attendance-previous-day" class="ghost" type="button">
          Previous day
        </button>
        <label class="attendance-date-label"
          >Date
          <span class="attendance-date-control">
            <input id="attendance-date" type="date" required />
            <span id="attendance-weekday" aria-live="polite"></span>
          </span>
        </label>
        <button id="attendance-next-day" class="ghost" type="button">
          Next day
        </button>
      </div>
      <label
        >Employee Name
        <input id="attendance-employee" type="search" maxlength="100"
      /></label>
      <label class="attendance-department"
        >Department
        <select id="attendance-department">
          <option value="">All</option>
        </select></label
      >
      <label class="attendance-status"
        >Status
        <select id="attendance-status">
          <option value="">All</option>
        </select></label
      >
      <div class="attendance-filter-actions">
        <button id="attendance-load" type="submit">Apply filters</button>
        <button id="attendance-refresh" class="ghost" type="button">
          Refresh
        </button>
        <span id="attendance-loading" class="loading-slot"></span>
      </div>
    </form>
    <div
      class="tablewrap attendance-table-scroll"
      tabindex="0"
      aria-label="Attendance table. Scroll inside this area vertically and horizontally to view records and columns."
    >
      <table
        class="attendance-table"
        aria-label="Employee attendance transactions"
      >
        <thead id="attendance-head"></thead>
        <tbody id="attendance-body"></tbody>
      </table>
    </div>
    <div
      id="attendance-time-logs"
      class="attendance-time-logs"
      role="region"
      aria-label="Time Logs"
      hidden
    ></div>
    <p
      id="attendance-info"
      class="note attendance-table-info"
      role="status"
    ></p>
  </section>
</section>
<dialog id="attendance-link-dialog" aria-labelledby="attendance-link-title">
  <form id="attendance-link-form">
    <h2 id="attendance-link-title">Link attendance to employee</h2>
    <p id="attendance-link-scanner"></p>
    <p id="attendance-link-status" class="note"></p>
    <label for="attendance-link-search"
      >Employee
      <input
        id="attendance-link-search"
        type="search"
        placeholder="Search name or employee number"
        required
      />
      <div
        id="attendance-link-results"
        class="head-search-results"
        hidden
      ></div>
    </label>
    <p id="attendance-link-selected" class="note"></p>
    <div class="actions">
      <button id="attendance-link-cancel" class="ghost" type="button">
        Cancel
      </button>
      <button id="attendance-link-save" type="submit">Confirm link</button>
    </div>
  </form>
</dialog>
