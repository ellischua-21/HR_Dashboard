<section id="view-employee-dashboard" class="view" hidden>
  <div class="employee-welcome">
    <p id="employee-greeting" class="employee-greeting" aria-live="polite"></p>
    <span
      id="employee-avatar"
      class="employee-avatar"
      aria-hidden="true"
    ></span>
  </div>
  <div class="employee-dashboard-grid">
    <div class="employee-dashboard-profile">
      <section class="panel employee-dashboard-card employee-job-card">
        <h2 class="employee-card-heading">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="7" width="18" height="14" rx="3" />
            <path
              d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a20 20 0 0 0 18 0M12 11v4"
            />
          </svg>
          Job Details
        </h2>
        <dl id="employee-job-details" class="employee-dashboard-details"></dl>
      </section>
      <section class="panel employee-dashboard-card employee-profile-card">
        <h2 class="employee-card-heading">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
          </svg>
          Employee Profile
        </h2>
        <dl
          id="employee-profile-summary"
          class="employee-dashboard-details"
        ></dl>
        <details
          id="employee-profile-expanded"
          class="employee-profile-expanded"
        >
          <summary>View Full Profile</summary>
          <div id="employee-profile-details"></div>
        </details>
      </section>
    </div>
    <section class="panel employee-dashboard-card employee-daily-attendance">
      <div class="employee-attendance-heading">
        <h2 class="employee-card-heading">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          Daily Attendance
        </h2>
        <button
          id="employee-time-logs-toggle"
          class="ghost employee-time-logs-button"
          type="button"
          aria-label="Show All Time Logs"
          aria-controls="employee-time-logs"
          aria-expanded="false"
        >
          Time Logs <span aria-hidden="true">&#9662;</span>
        </button>
      </div>
      <form
        id="employee-attendance-filters"
        class="toolbar employee-attendance-filters"
      >
        <button
          id="employee-previous-day"
          class="ghost"
          type="button"
          aria-label="Previous Day"
          title="Previous Day"
        >
          &#8249;
        </button>
        <label for="employee-attendance-date"
          >Date
          <input id="employee-attendance-date" type="date" required />
        </label>
        <button
          id="employee-next-day"
          class="ghost"
          type="button"
          aria-label="Next Day"
          title="Next Day"
        >
          &#8250;
        </button>
        <div class="employee-attendance-tools">
          <p
            id="employee-attendance-weekday"
            class="employee-attendance-weekday"
          ></p>
          <div class="employee-refresh-action">
            <button
              id="employee-attendance-refresh"
              class="ghost"
              type="submit"
            >
              Refresh
            </button>
            <span id="employee-attendance-loading" class="loading-slot"></span>
          </div>
        </div>
      </form>
      <dl
        id="employee-daily-times"
        class="employee-daily-times"
        aria-live="polite"
      ></dl>
      <div
        id="employee-time-logs"
        class="attendance-time-logs"
        role="region"
        aria-label="All Time Logs"
        hidden
      ></div>
    </section>
  </div>
</section>
